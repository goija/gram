<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>VORTEX-1080 // Faber-Castell Polychromos & Aardetinten Matrix</title>
    <style>
        :root {
            --bg-obsidian: #0A0D14;
            --ui-slate: #1B365D;
            --ui-cyan: #00FFFF;
            --ui-gold: #FFD700;
            --ui-amber: #FF8F00;
            --ui-text: #E2E8F0;
        }
        body {
            background-color: var(--bg-obsidian);
            color: var(--ui-text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            border: 2px solid var(--ui-cyan);
            padding: 20px;
            max-width: 1300px;
            width: 100%;
            background: rgba(27, 54, 93, 0.12);
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.15);
            border-radius: 8px;
        }
        h1 {
            font-size: 1.3rem;
            border-bottom: 1px solid var(--ui-cyan);
            padding-bottom: 10px;
            text-shadow: 0 0 10px var(--ui-cyan);
            color: var(--ui-gold);
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }
        .controls-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        button {
            background: var(--ui-slate);
            color: var(--ui-text);
            border: 1px solid var(--ui-cyan);
            padding: 6px 14px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.8rem;
            transition: all 0.3s;
            border-radius: 4px;
        }
        button:hover, button.active {
            background: var(--ui-cyan);
            color: var(--bg-obsidian);
            box-shadow: 0 0 10px var(--ui-cyan);
        }
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 4px;
            margin-top: 15px;
            max-height: 65vh;
            overflow-y: auto;
            padding: 5px;
            border: 1px dashed #334;
        }
        .color-cell {
            background: #111;
            border: 1px solid #334;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            color: #fff;
            text-align: center;
            padding: 2px;
            border-radius: 3px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .color-cell:hover {
            transform: scale(1.15);
            z-index: 10;
            box-shadow: 0 0 10px var(--ui-cyan);
            border-color: var(--ui-cyan);
        }
        .code {
            font-weight: bold;
            color: var(--ui-gold);
        }
        .status-bar {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--ui-amber);
            text-align: center;
            border-top: 1px solid #222;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FABER-CASTELL POLYCHROMOS // 13x18 Kleurenkaart Matrix</h1>
    
    <div class="controls-bar">
        <button class="active" onclick="filterPalette('all')">Alles (120 Kleuren)</button>
        <button onclick="filterPalette('earth')">Aardetinten & Rood (Wortels/Terra)</button>
        <button onclick="filterPalette('blue')">Cerulean / Blauw (Helio / Sky)</button>
        <button onclick="filterPalette('green')">Groene Tinten</button>
        <button onclick="filterPalette('grey')">Leisteen & Grijzen</button>
    </div>

    <div class="matrix-grid" id="matrixGrid">
        </div>

    <div class="status-bar" id="statusBar">
        > STATUS: 13 Rijen x 18 Kolommen (234 cellen) geladen. Klik op een cel voor specificaties.
    </div>
</div>

<script>
    const masterPalette = [
        { code: "101", name: "White", cat: "grey", bg: "#FFFFFF", text: "#000" },
        { code: "102", name: "Cream", cat: "earth", bg: "#FDF5E6", text: "#000" },
        { code: "103", name: "Ivory", cat: "earth", bg: "#FFFFF0", text: "#000" },
        { code: "104", name: "Lt Yell Glaze", cat: "earth", bg: "#FFF5CC", text: "#000" },
        { code: "107", name: "Cad Yellow", cat: "earth", bg: "#FFD700", text: "#000" },
        { code: "108", name: "Dk Cad Yell", cat: "earth", bg: "#FFB000", text: "#000" },
        { code: "109", name: "Dk Chrome", cat: "earth", bg: "#FFA500", text: "#000" },
        { code: "111", name: "Cad Orange", cat: "earth", bg: "#FF6600", text: "#fff" },
        { code: "115", name: "Dk Cad Org", cat: "earth", bg: "#E65C00", text: "#fff" },
        { code: "118", name: "Scarlet Red", cat: "earth", bg: "#E60000", text: "#fff" },
        { code: "130", name: "Salmon", cat: "earth", bg: "#FA8072", text: "#000" },
        { code: "131", name: "Coral", cat: "earth", bg: "#FF7F50", text: "#fff" },
        { code: "169", name: "Caput Mort", cat: "earth", bg: "#5C241C", text: "#fff" },
        { code: "186", name: "Terracotta", cat: "earth", bg: "#E2725B", text: "#fff" },
        { code: "187", name: "Burnt Ochre", cat: "earth", bg: "#CC7A00", text: "#fff" },
        { code: "188", name: "Sanguine", cat: "earth", bg: "#8A3B21", text: "#fff" },
        { code: "190", name: "Venetian Red", cat: "earth", bg: "#C84B31", text: "#fff" },
        { code: "191", name: "Pompeian Red", cat: "earth", bg: "#A63A2B", text: "#fff" },
        { code: "192", name: "Indian Red", cat: "earth", bg: "#CD5C5C", text: "#fff" },
        { code: "283", name: "Burnt Siena", cat: "earth", bg: "#8A3324", text: "#fff" },
        { code: "175", name: "Dark Sepia", cat: "earth", bg: "#2B1D0C", text: "#fff" },
        { code: "177", name: "Walnut Brown", cat: "earth", bg: "#4A3525", text: "#fff" },
        { code: "180", name: "Raw Umber", cat: "earth", bg: "#8B4513", text: "#fff" },
        { code: "280", name: "Burnt Umber", cat: "earth", bg: "#652C16", text: "#fff" },
        { code: "140", name: "Lt Ultramar", cat: "blue", bg: "#4169E1", text: "#fff" },
        { code: "143", name: "Cobalt Blue", cat: "blue", bg: "#0047AB", text: "#fff" },
        { code: "146", name: "Sky Blue", cat: "blue", bg: "#66CCFF", text: "#000" },
        { code: "151", name: "Helio Reddish", cat: "blue", bg: "#1E90FF", text: "#fff" },
        { code: "155", name: "Helio Turk", cat: "blue", bg: "#00CCCC", text: "#000" },
        { code: "157", name: "Dark Indigo", cat: "blue", bg: "#1A1A40", text: "#fff" },
        { code: "159", name: "Hooker Grn", cat: "green", bg: "#1B4D3E", text: "#fff" },
        { code: "163", name: "Emerald Grn", cat: "green", bg: "#50C878", text: "#000" },
        { code: "166", name: "Grass Green", cat: "green", bg: "#3F9B0B", text: "#fff" },
        { code: "170", name: "May Green", cat: "green", bg: "#4CAF50", text: "#fff" },
        { code: "264", name: "Dk Phth Grn", cat: "green", bg: "#0A311D", text: "#fff" },
        { code: "230", name: "Cold Grey I", cat: "grey", bg: "#D0D5DD", text: "#000" },
        { code: "232", name: "Cold Grey III", cat: "grey", bg: "#9AA4B2", text: "#000" },
        { code: "234", name: "Cold Grey V", cat: "grey", bg: "#5C646B", text: "#fff" },
        { code: "270", name: "Warm Grey I", cat: "grey", bg: "#E5E0DA", text: "#000" },
        { code: "273", name: "Warm Grey IV", cat: "grey", bg: "#A09E95", text: "#000" },
        { code: "181", name: "Payne's Grey", cat: "grey", bg: "#40404F", text: "#fff" },
        { code: "199", name: "Black", cat: "grey", bg: "#111111", text: "#fff" }
    ];

    const grid = document.getElementById('matrixGrid');
    const statusBar = document.getElementById('statusBar');

    function renderGrid(filter = 'all') {
        grid.innerHTML = '';
        let sourceList = filter === 'all' ? masterPalette : masterPalette.filter(item => item.cat === filter);
        if (sourceList.length === 0) sourceList = masterPalette;

        const totalCells = 13 * 18; // 234 cellen

        for (let i = 0; i < totalCells; i++) {
            const item = sourceList[i % sourceList.length];
            const cell = document.createElement('div');
            cell.className = 'color-cell';
            cell.style.backgroundColor = item.bg;
            cell.style.color = item.text;
            
            cell.innerHTML = `
                <span class="code">${item.code}</span>
                <span style="font-size: 0.5rem; overflow:hidden; max-height:16px;">${item.name}</span>
            `;
            
            cell.addEventListener('click', () => {
                statusBar.innerHTML = `> SELECTIE: Cel [Rij ${Math.floor(i/18)+1}, Kolom ${(i%18)+1}] — Potlood <strong>${item.code}</strong> (${item.name}) [Categorie: ${item.cat.toUpperCase()}]`;
            });
            
            grid.appendChild(cell);
        }
    }

    function filterPalette(category) {
        document.querySelectorAll('.controls-bar button').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderGrid(category);
        statusBar.innerHTML = `> FILTER ACTIEF: ${category.toUpperCase()} geladen in 13x18 matrix.`;
    }

    renderGrid('all');
</script>

</body>
</html>
